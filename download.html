    <style>
        /* Custom enhancements for download page */
        .dl-cards-grid {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 28px;
            margin: 40px auto 0;
            max-width: 1040px;
        }

        .dl-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 32px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
        }

        .dl-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4);
        }

        .dl-card.featured {
            border-color: rgba(56, 189, 248, 0.45);
            background: linear-gradient(180deg, hsl(217 38% 13%) 0%, hsl(217 38% 10%) 100%);
            box-shadow: 0 0 50px -15px hsl(199 89% 48% / .22);
        }

        [data-theme="light"] .dl-card.featured {
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border-color: rgba(6, 182, 212, 0.4);
            box-shadow: 0 16px 36px -10px rgba(6, 182, 212, 0.18);
        }

        .dl-ribbon {
            position: absolute;
            top: -12px;
            right: 28px;
            background: linear-gradient(135deg, hsl(199 89% 48%), hsl(203 94% 38%));
            color: #fff;
            font-size: 11px;
            font-weight: 750;
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 999px;
            box-shadow: 0 4px 12px hsl(199 89% 48% / .4);
        }

        .dl-header {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 22px;
        }

        .dl-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: hsl(199 89% 48% / .14);
            border: 1px solid hsl(199 89% 48% / .3);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            padding: 7px;
            overflow: hidden;
        }

        .dl-icon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .dl-icon.dl-icon-clean {
            background: transparent;
            border: none;
            padding: 0;
        }

        .dl-icon.dl-icon-clean .dl-icon-img {
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.22);
        }

        .dl-title-group h3 {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.25;
            color: var(--fg);
        }

        .dl-filename {
            display: inline-block;
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--primary-light);
            margin-top: 4px;
            word-break: break-all;
        }

        .dl-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            padding: 14px 0;
            border-top: 1px solid var(--border-soft);
            border-bottom: 1px solid var(--border-soft);
            margin: 16px 0 22px;
            font-size: 13px;
            color: var(--muted);
        }

        .dl-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dl-meta-item strong {
            color: var(--fg);
            font-weight: 600;
        }

        .dl-checklist {
            list-style: none;
            padding: 0;
            margin: 0 0 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dl-checklist li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 14px;
            color: var(--fg);
            line-height: 1.45;
        }

        .dl-checklist li svg {
            width: 17px;
            height: 17px;
            stroke: #22c55e;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .dl-action-area {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dl-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15.5px;
            font-weight: 650;
            padding: 15px 24px;
            border-radius: 12px;
            text-decoration: none;
            transition: all .2s ease;
            cursor: pointer;
        }

        .dl-btn-primary {
            background: linear-gradient(135deg, hsl(199 89% 48%), hsl(203 94% 38%));
            color: #fff;
            box-shadow: 0 8px 24px -6px hsl(199 89% 48% / .45);
            border: 1px solid hsl(199 89% 60% / .3);
        }

        .dl-btn-primary:hover {
            background: linear-gradient(135deg, hsl(199 92% 52%), hsl(203 96% 42%));
            box-shadow: 0 12px 28px -4px hsl(199 89% 48% / .55);
            transform: translateY(-2px);
        }

        .dl-btn-secondary {
            background: hsl(217 38% 15%);
            color: var(--fg);
            border: 1px solid var(--border);
        }

        [data-theme="light"] .dl-btn-secondary {
            background: #f1f5f9;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        .dl-btn-secondary:hover {
            border-color: var(--primary-light);
            background: hsl(217 38% 18%);
            transform: translateY(-2px);
        }

        [data-theme="light"] .dl-btn-secondary:hover {
            background: #e2e8f0;
        }

        .dl-foot-note {
            font-size: 12px;
            color: var(--faint);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .quick-steps-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
            margin-top: 36px;
        }

        .quick-step-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 26px;
            position: relative;
        }

        .quick-step-num {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: hsl(199 89% 48% / .14);
            color: var(--primary-light);
            border: 1px solid hsl(199 89% 48% / .3);
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 16px;
            font-family: var(--mono);
        }

        .quick-step-card h4 {
            font-size: 17px;
            font-weight: 650;
            margin-bottom: 8px;
            color: var(--fg);
        }

        .quick-step-card p {
            font-size: 13.5px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .quick-step-card a {
            color: var(--primary-light);
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .quick-step-card a:hover {
            text-decoration: underline;
        }

        .offline-shield-box {
            background: linear-gradient(135deg, hsl(217 38% 12%), hsl(220 50% 8%));
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 20px;
            padding: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 32px;
            margin-top: 50px;
        }

        [data-theme="light"] .offline-shield-box {
            background: linear-gradient(135deg, #ffffff, #f0fdf4);
            border-color: #bbf7d0;
        }

        @media (max-width: 960px) {
            .dl-cards-grid {
                grid-template-columns: 1fr;
            }

            .quick-steps-grid {
                grid-template-columns: 1fr;
            }

            .offline-shield-box {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
