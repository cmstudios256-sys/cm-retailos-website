  <style>
    /* Dedicated Guide & Screenshot Styles */
    .guide-figure {
      margin: 28px 0;
      border-radius: 14px;
      overflow: hidden;
      background: #080c18;
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }

    .guide-figure:hover {
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 18px 40px rgba(6, 182, 212, 0.2);
    }

    .guide-figure img {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      display: block;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .guide-caption {
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.96);
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.5;
    }

    .guide-caption .fig-tag {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .guide-sub-block {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .guide-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-cyan {
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .badge-green {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .badge-purple {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .badge-amber {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* Teaching / explanation blocks under each figure */
    .guide-explain {
      padding: 18px 22px 20px;
      background: rgba(8, 14, 26, 0.92);
      border-top: 1px dashed rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      font-size: 14.5px;
      line-height: 1.65;
    }

    .ge-head {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
      font-weight: 700;
      font-size: 12.5px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .ge-head .ge-ico {
      width: 17px;
      height: 17px;
      color: #38bdf8;
      flex: 0 0 auto;
    }

    .ge-para {
      margin: 0 0 10px;
      color: #9fb0c7;
    }

    .ge-steps {
      margin: 0 0 4px;
      padding: 0;
      list-style: none;
      counter-reset: ges;
    }

    .ge-steps li {
      counter-increment: ges;
      position: relative;
      padding: 4px 0 4px 34px;
      color: #cbd5e1;
    }

    .ge-steps li::before {
      content: counter(ges);
      position: absolute;
      left: 0;
      top: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ge-tip,
    .ge-warn {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.55;
    }

    .ge-tip {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #a7f3d0;
    }

    .ge-warn {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fde68a;
    }

    .guide-caption code,
    .guide-explain code {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
      padding: 1px 6px;
      border-radius: 5px;
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      font-size: 12.5px;
      word-break: break-word;
    }

    @media (max-width: 640px) {
      .guide-caption {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 10px 14px;
        font-size: 12.5px;
      }

      .guide-caption .fig-tag {
        font-size: 11px;
        padding: 3px 8px;
      }

      .guide-explain {
        padding: 14px 16px;
        font-size: 13.5px;
      }

      .ge-steps li {
        padding-left: 28px;
      }

      .ge-steps li::before {
        width: 18px;
        height: 18px;
        font-size: 10.5px;
        top: 6px;
      }
    }
  </style>
